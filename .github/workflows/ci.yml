name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: No hardcoded Gemini keys
        run: "! git grep -nE 'AIza[0-9A-Za-z_-]{30,}' -- . ':(exclude)package-lock.json'"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
